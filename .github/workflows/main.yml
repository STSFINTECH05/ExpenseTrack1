name: Backend CI / Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Validate Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expensetrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js db.js

      - name: Start server and test health endpoint
        env:
          PORT: 5000
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/expensetrack_test
          CLIENT_URL: http://localhost:5173
        run: |
          # Start server in background
          node server.js &
          SERVER_PID=$!

          # Wait for server to boot
          echo "Waiting for backend server to start..."
          for i in {1..15}; do
            if curl -s http://localhost:5000/api/health | grep -q "STS FINTECH"; then
              echo "Backend is healthy and connected!"
              break
            fi
            sleep 1
          done

          # Verify health endpoint response
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" http://localhost:5000/api/health)
          cat /tmp/health_response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HTTP_STATUS"
            kill $SERVER_PID
            exit 1
          fi

          # Test payments endpoint
          echo "Testing GET /api/payments..."
          PAYMENTS_STATUS=$(curl -s -o /tmp/payments_response.json -w "%{http_code}" http://localhost:5000/api/payments)
          cat /tmp/payments_response.json
          echo ""

          if [ "$PAYMENTS_STATUS" -ne 200 ]; then
            echo "Payments check failed with status $PAYMENTS_STATUS"
            kill $SERVER_PID
            exit 1
          fi

          # Cleanup
          kill $SERVER_PID
          echo "All backend CI smoke tests passed successfully!"
